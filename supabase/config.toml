# These functions validate their link tokens in their handlers.
# Never disable checks in those handlers when disabling the legacy JWT gateway.
[functions.calendario-ics]
verify_jwt = false

[functions.portal-archivo]
verify_jwt = false

# Product Clipper verifies the user JWT with Auth.getUser before every operation.
# Supports current signing keys instead of the legacy-secret-only gateway.
[functions.product-clipper]
verify_jwt = false

# Not deployed by the app workflow. Test-only, own JWT verification and signed webhooks.
[functions.billing]
verify_jwt = false
