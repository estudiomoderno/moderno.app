# These functions validate their link tokens in their handlers.
# Never disable checks in those handlers when disabling the legacy JWT gateway.
[functions.calendario-ics]
verify_jwt = false

[functions.portal-archivo]
verify_jwt = false

# Product Clipper verifies the user JWT with Auth.getUser before every operation.
# Supports current signing keys instead of the legacy-secret-only gateway.
[functions.product-clipper]
verify_jwt = false

# Mail validates every caller with Auth.getUser and verifies the administrator
# membership inside the handler, so it also supports current signing keys.
[functions.mail-connect]
verify_jwt = false

# Secretario validates each user with Auth.getUser and reads the existing
# filtered RPC using that user's JWT. Environment, origin and rollout guards
# fail closed before any study data or model call.
[functions.secretario]
verify_jwt = false
