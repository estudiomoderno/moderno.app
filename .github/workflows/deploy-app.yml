name: Desplegar app.moderno.app

on:
  push:
    branches: [main]
    paths: ['app/**', 'mailer/**', '.github/workflows/deploy-app.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: app-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar candidato
        run: node --test scripts/*.test.mjs
      - name: Comprobar autorización de invitaciones sin enviar correo
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -l mailer/enviar-invitacion.php
          php -l mailer/product-clipper-proxy-core.php
          php -l mailer/product-clipper.php
          php scripts/invitation-auth.test.php
          php scripts/product-clipper-proxy.test.php
      - name: Configurar buscador opcional de direcciones
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          PLACES_LOCATION_READY: ${{ vars.PLACES_LOCATION_READY }}
        run: node scripts/build-places-config.mjs
      - name: Comprobar Google con una dirección pública y sin conectar la app
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_BROWSER_KEY" ]; then
            python3 -m pip install --disable-pip-version-check playwright==1.56.0
            python3 scripts/places-live-smoke.py
          fi
      - name: Comprobar pasarela de correo sin una sesión real
        run: node scripts/check-mail-gateway.mjs
      - name: Separar recursos de la entrada
        run: |
          mkdir -p release-assets release-entry
          cp -a app/. release-assets/
          mv release-assets/index.html release-entry/index.html
          mkdir -p release-mail-support/api release-mail-entry/api
          cp mailer/autorizar-invitacion.php release-mail-support/api/
          cp mailer/product-clipper-proxy-core.php release-mail-support/api/
          cp mailer/enviar-invitacion.php release-mail-entry/api/
          cp mailer/product-clipper.php release-mail-entry/api/

      - name: Publicar comprobación de permisos del correo
        id: deploy_mail_support
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-mail-support/
          state-name: .ftp-mail-support-state.json
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/config.php
      - name: Reintentar comprobación de permisos del correo
        if: steps.deploy_mail_support.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-mail-support/
          state-name: .ftp-mail-support-state.json
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/config.php
      - name: Publicar servicio de invitaciones protegido
        id: deploy_mail_entry
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-mail-entry/
          state-name: .ftp-mail-entry-state.json
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/config.php
      - name: Reintentar servicio de invitaciones protegido
        if: steps.deploy_mail_entry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-mail-entry/
          state-name: .ftp-mail-entry-state.json
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/config.php

      - name: Verificar puente del importador sin crear capturas
        run: node scripts/verify-product-clipper-proxy.mjs

      - name: Subir recursos antes del HTML
        id: deploy_assets
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-assets/
          state-name: .ftp-assets-state.json
          server-dir: ${{ secrets.FTP_SERVER_DIR }}   # p. ej. /app.moderno.app/
          exclude: |
            **/.git*
            **/.git*/**
            **/api/**
            index.html
      - name: Reintentar recursos antes del HTML
        if: steps.deploy_assets.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-assets/
          state-name: .ftp-assets-state.json
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/api/**
            index.html
      - name: Publicar entrada una vez disponibles los recursos
        id: deploy_entry
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-entry/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-entry-state.json
      - name: Reintentar entrada una vez disponibles los recursos
        if: steps.deploy_entry.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./release-entry/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-entry-state.json

      - name: Verificar entrada y recursos públicos sin iniciar sesión
        run: node scripts/verify-app-publication.mjs
