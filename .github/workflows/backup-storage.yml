name: Verificar y copiar archivos

on:
  schedule:
    - cron: '23 4 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      mode:
        description: Operación
        required: true
        default: test-drive
        type: choice
        options: [test-drive, backup, backup-service]

permissions:
  contents: read

concurrency:
  group: storage-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Comprobar lógica
        run: |
          node --test scripts/backup-storage.test.mjs
          python3 scripts/backup-service.test.py
      - name: Instalar herramienta de copia
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
      - name: Preparar identidad y ocultar configuración
        env:
          GOOGLE_CONFIG: ${{ secrets.BACKUP_GOOGLE_CONFIG }}
        run: node scripts/prepare-backup-identity.mjs
      - name: Acceso temporal a Google
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ fromJSON(secrets.BACKUP_GOOGLE_CONFIG).project_id }}
          workload_identity_provider: ${{ fromJSON(secrets.BACKUP_GOOGLE_CONFIG).provider }}
          service_account: ${{ fromJSON(secrets.BACKUP_GOOGLE_CONFIG).service_account }}
          token_format: access_token
          access_token_lifetime: 3600s
          access_token_scopes: https://www.googleapis.com/auth/drive
          create_credentials_file: false
          export_environment_variables: false
      - name: Copiar y verificar
        if: github.event_name == 'schedule' || inputs.mode != 'backup-service'
        env:
          BACKUP_MODE: ${{ github.event_name == 'schedule' && 'backup' || inputs.mode }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_CONFIG: ${{ secrets.BACKUP_GOOGLE_CONFIG }}
          SOURCE_CONFIG: ${{ secrets.BACKUP_SOURCE_CONFIG }}
        run: node scripts/run-backup-ci.mjs
      - name: Respaldar código privado del servicio
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backup-service'
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_CONFIG: ${{ secrets.BACKUP_GOOGLE_CONFIG }}
          # Official generic host: certificate covers dondominio.com, not the customer's alias.
          FTP_HOST: ftp.dondominio.com
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: app/
        run: python3 scripts/backup-service.py
