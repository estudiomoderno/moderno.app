name: Acreditar guardado con 1.000 usuarios ficticios

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de carga aislada
        required: true
        default: smoke
        type: choice
        options: [smoke, target, margin, concurrent-1000, large, reconnect, contention, replay, noop, array-sync, limits, soak]
      protocol:
        description: Contrato de guardado (legacy solo para comparativa)
        required: true
        default: v2
        type: choice
        options: [v2, legacy]
      confirmation:
        description: Escribe CARGA_FICTICIA_EN_MODERNO_PRUEBAS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: moderno-load-save-staging
  cancel-in-progress: false

jobs:
  load:
    name: ${{ inputs.profile }} · ${{ inputs.protocol }} · entorno aislado
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: moderno-pruebas-load
    env:
      LOAD_PROFILE: ${{ inputs.profile }}
      LOAD_SAVE_PROTOCOL: ${{ inputs.protocol }}
      LOAD_ISOLATION_ACK: ${{ inputs.confirmation }}
      LOAD_ALLOWED_PROJECT_REF: ${{ vars.LOAD_ALLOWED_PROJECT_REF }}
      K6_IMAGE: ${{ vars.LOAD_K6_IMAGE }}
    steps:
      - name: Obtener codigo sin credenciales persistentes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validar arnes y preparar rutas efimeras
        shell: bash
        run: |
          set -euo pipefail
          test "$LOAD_ISOLATION_ACK" = 'CARGA_FICTICIA_EN_MODERNO_PRUEBAS'
          case "$LOAD_SAVE_PROTOCOL:$LOAD_PROFILE" in
            legacy:replay|legacy:noop|legacy:array-sync|legacy:limits|legacy:concurrent-1000) exit 1 ;;
          esac
          [[ "$K6_IMAGE" =~ ^grafana/k6@sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/moderno-load-fixture" "$RUNNER_TEMP/moderno-load-results"
          echo "LOAD_RUN_ID=load-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "LOAD_USERS_FILE=$RUNNER_TEMP/moderno-load-fixture/users.json" >> "$GITHUB_ENV"
          echo "LOAD_RECOVERY_FILE=$RUNNER_TEMP/moderno-load-results/recovery-manifest.json" >> "$GITHUB_ENV"
          node --test scripts/load-harness.test.mjs
      - name: Crear 1.000 identidades y 250 estudios ficticios
        id: seed
        env:
          LOAD_SUPABASE_URL: ${{ secrets.LOAD_SUPABASE_URL }}
          LOAD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LOAD_SUPABASE_PUBLISHABLE_KEY }}
          LOAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOAD_SUPABASE_SERVICE_ROLE_KEY }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
        run: node scripts/load/seed.mjs
      - name: Capturar metricas del servidor antes de la carga
        env:
          PGURI: ${{ secrets.LOAD_DATABASE_URL }}
        run: |
          docker run --rm \
            -e PGURI \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
            psql "$PGURI" -X -v ON_ERROR_STOP=1 -f /work/scripts/load/server-metrics.sql \
            > "$RUNNER_TEMP/moderno-load-results/server-before.csv"
      - name: Ejecutar carga y aplicar SLO
        env:
          LOAD_SUPABASE_URL: ${{ secrets.LOAD_SUPABASE_URL }}
          LOAD_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.LOAD_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e LOAD_PROFILE \
            -e LOAD_SAVE_PROTOCOL \
            -e LOAD_ISOLATION_ACK \
            -e LOAD_ALLOWED_PROJECT_REF \
            -e LOAD_SUPABASE_URL \
            -e LOAD_SUPABASE_PUBLISHABLE_KEY \
            -e LOAD_RUN_ID \
            -e LOAD_USERS_FILE=/fixtures/users.json \
            -e LOAD_SUMMARY_FILE=/results/summary.json \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$RUNNER_TEMP/moderno-load-fixture:/fixtures:ro" \
            -v "$RUNNER_TEMP/moderno-load-results:/results" \
            "$K6_IMAGE" run /work/scripts/load/save-path.k6.js
      - name: Capturar metricas del servidor despues de la carga
        if: always() && steps.seed.outcome == 'success'
        env:
          PGURI: ${{ secrets.LOAD_DATABASE_URL }}
        run: |
          docker run --rm \
            -e PGURI \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
            psql "$PGURI" -X -v ON_ERROR_STOP=1 -f /work/scripts/load/server-metrics.sql \
            > "$RUNNER_TEMP/moderno-load-results/server-after.csv"
      - name: Conservar evidencia de carga y SLO
        if: always() && steps.seed.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardado-${{ env.LOAD_RUN_ID }}-${{ inputs.profile }}-${{ inputs.protocol }}
          path: ${{ runner.temp }}/moderno-load-results/
          if-no-files-found: error
          retention-days: 30
      - name: Eliminar exclusivamente el fixture de esta ejecucion
        if: always() && steps.seed.outcome != 'skipped'
        env:
          LOAD_SUPABASE_URL: ${{ secrets.LOAD_SUPABASE_URL }}
          LOAD_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LOAD_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if ! test -f "$LOAD_USERS_FILE"; then
            if test -f "$LOAD_RECOVERY_FILE"; then
              echo "LOAD_USERS_FILE=$LOAD_RECOVERY_FILE" >> "$GITHUB_ENV"
              export LOAD_USERS_FILE="$LOAD_RECOVERY_FILE"
            else
              node scripts/load/recovery-manifest.mjs
            fi
          fi
          node scripts/load/teardown.mjs
      - name: Confirmar que no quedan tokens en el espacio de trabajo
        if: always()
        run: |
          test ! -e "$RUNNER_TEMP/moderno-load-fixture/users.json"
          test ! -e "$GITHUB_WORKSPACE/users.json"
