name: Taller - comprobar cambios propuestos

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taller-pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pruebas aisladas (sin produccion)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: solo-prueba-ficticia
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obtener codigo sin credenciales persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas de JavaScript
        run: node --test scripts/*.test.mjs
      - name: Equivalencia SQL y tiempos con datos ficticios
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 < scripts/sql/fiabilidad-bootstrap-local.sql
          node scripts/build-fiabilidad-sql.mjs | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
      - name: Guardado delta, roles y conflictos con datos ficticios
        run: node scripts/build-delta-checks.mjs | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
      - name: Guardado de listas como colaborador y permisos con datos ficticios
        run: node scripts/build-collaborator-checks.mjs | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
      - name: Equivalencia del combinador optimizado y permisos
        run: node scripts/build-collaborator-performance-checks.mjs | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
      - name: Borrado de productos por colaboradores y protección de proyectos
        run: node scripts/build-product-delete-checks.mjs | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
      - name: Aceptación de invitaciones y aislamiento sin crear estudios
        run: node scripts/build-invitation-checks.mjs | docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1
      - name: Preparar PHP (si falta)
        run: |
          if ! command -v php >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
      - name: Sintaxis del servicio de invitaciones
        run: php -l mailer/enviar-invitacion.php
      - name: Pruebas de autorizacion de invitaciones (sin enviar correos)
        run: php scripts/invitation-auth.test.php
