name: Secretario - comprobación aislada

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/index.html'
      - 'app/secretario-*.js'
      - 'app/secretary-feedback.js'
      - 'app/brand/secretario.css'
      - 'app/brand/secretario/**'
      - 'supabase/functions/secretario/**'
      - 'scripts/secretario*'
      - 'scripts/check-secretario-gateway*'
      - 'scripts/dev-server.mjs'
      - '.github/workflows/secretario-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: Conversación y borradores ficticios en Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar pasarela productiva sin sesión, datos ni IA
        run: node scripts/check-secretario-gateway.mjs
      - name: Preparar navegador de pruebas
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verificar Secretario sin API de pago ni datos reales
        run: python scripts/secretario-browser.test.py "${{ runner.temp }}/secretario-capturas"
      - name: Guardar capturas sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moderno-secretario-fixtures
          path: ${{ runner.temp }}/secretario-capturas/
          if-no-files-found: ignore
          retention-days: 7
